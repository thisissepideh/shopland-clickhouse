
name: shopland

services:
  # ---- ClickHouse ----
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: shopland-clickhouse
    environment:
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: student
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      postgres:
        condition: service_healthy

  # ---- PostgreSQL ----
  postgres:
    image: postgres:17
    container_name: shopland-postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- Kafka (KRaft) ----
  kafka:
    image: apache/kafka:4.0.0
    container_name: shopland-kafka
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # ---- MinIO Server ----
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: shopland-minio
    profiles: ["bonus"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---- MinIO Bucket Initialization ----
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: shopland-minio-init
    profiles: ["bonus"]
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo "Waiting for MinIO..."
        sleep 2
      done
      mc mb --ignore-existing local/shop
      echo "MinIO bucket shop is ready"

volumes:
  clickhouse_data:
  postgres_data:
  minio_data:
